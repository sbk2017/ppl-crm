{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h3 class="mb-3">{{ title }}</h3>
<form method="post" class="card p-4">{% csrf_token %}
  <div class="row g-3">
    {% for f in form %}
      <div class="col-md-6"><label class="form-label">{{ f.label }}</label>{{ f }}
        {% if f.errors %}<div class="text-danger small">{{ f.errors }}</div>{% endif %}</div>
    {% endfor %}
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save</button>
    <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
</form>
<style>input,select{display:block;width:100%;padding:.375rem .75rem;border:1px solid #ced4da;border-radius:.375rem;}</style>
{% endblock %}
