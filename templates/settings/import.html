{% extends "base.html" %}
{% block title %}Import Leads{% endblock %}
{% block content %}
<h3 class="mb-3">Import Leads from Excel</h3>
<form method="post" enctype="multipart/form-data" class="card p-4">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Import</button>
  <a href="{% url 'lead_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
<p class="text-muted small mt-3">Required column: <code>name</code>. Optional: company, email, phone, stage, source, value, owner_username.</p>
{% endblock %}
