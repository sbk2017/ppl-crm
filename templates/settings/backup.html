{% extends "base.html" %}
{% block title %}Backups{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="m-0">Backups</h3>
  <a href="{% url 'backup_create' %}" class="btn btn-gold">Create Backup</a>
</div>
<div class="card">
<table class="table mb-0">
  <thead><tr><th>File</th><th>Size</th><th></th></tr></thead>
  <tbody>
  {% for f in files %}
    <tr>
      <td>{{ f.name }}</td>
      <td>{{ f.stat.size|filesizeformat }}</td>
      <td><a href="{% url 'backup_download' f.name %}" class="btn btn-sm btn-outline-primary">Download</a></td>
    </tr>
  {% empty %}<tr><td colspan="3" class="text-center text-muted py-4">No backups yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
