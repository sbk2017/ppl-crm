{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h3 class="mb-3">{{ title }}</h3>
<form method="post" class="card p-4">{% csrf_token %}
  <div class="row g-3">
    {% for field in form %}
      <div class="col-md-6">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
      </div>
    {% endfor %}
  </div>
  <div class="mt-4">
    <button class="btn btn-primary">Save</button>
    <a href="{% url 'lead_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
<style>input,select,textarea{display:block;width:100%;padding:.375rem .75rem;border:1px solid #ced4da;border-radius:.375rem;}</style>
{% endblock %}
