{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 mt-5">
      <h4 class="mb-3 text-center">PPL CRM Login</h4>
      <form method="post">{% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">Invalid credentials.</div>{% endif %}
        <div class="mb-3"><label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
    <p class="text-center text-muted mt-3 small">Prestige Pulse Cargo Services LLC</p>
  </div>
</div>
{% endblock %}
